[package]
name = "clipmark"
version = "0.3.0"
edition = "2021"
description = "Accessible WAV clip marker (Rust + egui/AccessKit)"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["accesskit"] }
egui = "0.31"
rfd = "0.15"
hound = "3.5"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
